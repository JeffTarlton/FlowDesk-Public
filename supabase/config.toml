# Supabase CLI configuration for running FlowDesk locally (supabase start).
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
#
# The hosted project does not read this file, except for the [functions.*]
# settings, which "supabase functions deploy" uses.

project_id = "flowdesk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# The default admin is created by a migration (supabase/migrations), so there
# is no separate seed.sql.
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The Vite dev server
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Users are created by an admin in the app (Admin -> Users), never by signing up.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Despite its name, this switches the whole email provider (email + password
# sign-in) on or off in the local stack. It must stay true or nobody can sign
# in. New sign-ups are already blocked by [auth] enable_signup = false above.
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

# admin-actions checks the caller itself: every request must carry a valid user
# token (verified with auth.getUser) before any action runs, and each action
# then checks the caller's role or identity. The gateway JWT check is therefore
# turned off, which also avoids "Invalid JWT" errors with the newer API keys.
[functions.admin-actions]
enabled = true
verify_jwt = false
